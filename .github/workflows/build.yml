name: Build Yuklick arm64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Check public source
        run: python3 scripts/prepare_publication.py --check
      - name: Build arm64 Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :smartautoclicker:assembleFDroidDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yuklick-arm64-debug
          path: smartautoclicker/build/outputs/yuklick/Yuklick.apk
          if-no-files-found: error

